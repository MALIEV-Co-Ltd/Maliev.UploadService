# T178: docker-compose.yml for local development with all dependencies
version: '3.8'

services:
  uploadservice:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "5000:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__UploadServiceDbContext=Host=postgres;Port=5432;Database=uploadservice;Username=postgres;Password=postgres
      - ConnectionStrings__redis=redis:6379
      - ConnectionStrings__rabbitmq=rabbitmq
      - RabbitMQ__Username=guest
      - RabbitMQ__Password=guest
      - GoogleCloud__BucketName=maliev-uploads-dev
      - ClamAV__Host=clamav
      - ClamAV__Port=3310
    depends_on:
      - postgres
      - redis
      - rabbitmq
      - clamav

  postgres:
    image: postgres:15
    environment:
      POSTGRES_DB: uploadservice
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  rabbitmq:
    image: rabbitmq:3-management
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq

  clamav:
    image: clamav/clamav:latest
    ports:
      - "3310:3310"
    volumes:
      - clamav_data:/var/lib/clamav

volumes:
  postgres_data:
  redis_data:
  rabbitmq_data:
  clamav_data:
