name: Reusable Validation

on:
  workflow_call:

permissions:
  contents: read

jobs:
  validate:
    name: validate
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout Upload service
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
        with:
          path: service
          persist-credentials: false

      - name: Checkout exact Aspire defaults
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
        with:
          repository: MALIEV-Co-Ltd/Maliev.Aspire
          ref: 20a2746e024de6bd070b51af99bab7b761612c06
          path: Maliev.Aspire
          persist-credentials: false

      - name: Checkout exact messaging contracts
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
        with:
          repository: MALIEV-Co-Ltd/Maliev.MessagingContracts
          ref: 9c41d6524a485bf03ba022b8170f47366ab1a77a
          path: Maliev.MessagingContracts
          persist-credentials: false

      - name: Set up .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68  # v6.0.0
        with:
          dotnet-version: 10.0.x

      - name: Restore
        working-directory: service
        run: GITHUB_ACTIONS=false dotnet restore Maliev.UploadService.slnx --configfile nuget.validation.config

      - name: Audit dependencies
        working-directory: service
        run: GITHUB_ACTIONS=false dotnet list Maliev.UploadService.slnx package --vulnerable --include-transitive --no-restore

      - name: Verify formatting
        working-directory: service
        run: GITHUB_ACTIONS=false dotnet format Maliev.UploadService.slnx --verify-no-changes --no-restore

      - name: Build
        working-directory: service
        run: GITHUB_ACTIONS=false dotnet build Maliev.UploadService.slnx --configuration Release --no-restore

      - name: Test
        working-directory: service
        run: GITHUB_ACTIONS=false dotnet test Maliev.UploadService.slnx --configuration Release --no-build --no-restore --verbosity normal

      - name: Scan repository for secrets
        shell: bash
        run: |
          set -euo pipefail
          archive="gitleaks_8.30.1_linux_x64.tar.gz"
          curl --fail --location --silent --show-error \
            --output "$archive" \
            "https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/$archive"
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  $archive" | sha256sum --check
          tar --extract --gzip --file "$archive" gitleaks
          ./gitleaks dir service --no-banner --redact
